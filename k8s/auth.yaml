apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: app
  labels:
    app: apartmentrentals
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
      - name: auth
        image: auth:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        env:
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
        - name: ASPNETCORE_ENVIRONMENT
          value: "Development"
        - name: ConnectionStrings__MongoDB
          value: "mongodb://mongodb:27017/AuthStore"
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: app
  labels:
    app: apartmentrentals
spec:
  selector:
    app: auth
  ports:
  - port: 8080
    targetPort: 8080