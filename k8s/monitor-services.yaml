apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: microservices-monitor
  namespace: monitoring
  labels:
    release: prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - app 
  
  selector:
    matchLabels:
      app: apartmentrentals 
      
  endpoints:
    - port: http
      path: /metrics
      interval: 15s