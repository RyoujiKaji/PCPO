apiVersion: apps/v1
kind: Deployment
metadata:
  name: apigateway
  namespace: app
  labels:
    app: apartmentrentals
spec:
  replicas: 2
  selector:
    matchLabels:
      app: apigateway
  template:
    metadata:
      labels:
        app: apigateway
    spec:
      containers:
      - name: apigateway
        image: apigateway:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        env:
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
        - name: ASPNETCORE_ENVIRONMENT
          value: "Development"
---
apiVersion: v1
kind: Service
metadata:
  name: apigateway
  namespace: app
  labels:
    app: apartmentrentals
spec:
  type: NodePort   # Для доступа извне
  selector:
    app: apigateway
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080